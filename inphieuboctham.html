<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm In Phiếu TGDĐ Tam Hòa</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @page { size: A4; margin: 5mm; }
        body { background-color: #f3f4f6; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; color: #000; }
        
        /* Cấu trúc 1 trang A4 chứa 4 phiếu - Vừa khít giấy */
        .ticket-wrapper { height: 287mm; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box; }
        .page-break { page-break-after: always; margin-bottom: 20px; }
        .page-break:last-child { page-break-after: auto; margin-bottom: 0; }
        
        /* Cấu trúc từng phiếu - Tăng xíu chiều cao để chứa 2 dòng lưu ý */
        .ticket-row { height: 71mm; border: 2px solid #000; display: flex; position: relative; page-break-inside: avoid; background: #fff; overflow: hidden; }
        
        /* Dấu chìm - ĐÃ LÀM ĐẬM LÊN THEO Ý ÔNG */
        .watermark { 
            position: absolute; 
            inset: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 3.5rem; 
            font-weight: 900; 
            color: #444; 
            opacity: 0.25; 
            -webkit-text-stroke: 1.5px #444; /* Viền làm chữ đậm và béo lên */
            transform: rotate(-30deg); 
            pointer-events: none; 
            z-index: 0; 
            white-space: nowrap; 
        }
        
        /* Tối ưu không gian bên trong phiếu */
        .ticket-stub { width: 50%; padding: 8px 12px; display: flex; flex-direction: column; justify-content: space-between; position: relative; z-index: 1; }
        .dashed-border-right { border-right: 2px dashed #000; }
        
        /* Font chữ nội dung - Ép nhỏ lại 1 chút để không bị tràn */
        .title-text { font-weight: 900; font-size: 1.1rem; }
        .body-text { font-weight: 900; font-size: 1.15rem; line-height: 1.1; }
        .date-text { font-weight: 900; font-size: 0.8rem; border: 2px solid #000; padding: 4px 6px; white-space: nowrap; }
        
        /* Dòng lưu ý - Nhỏ và in nghiêng để tiết kiệm diện tích */
        .note-text { font-weight: 700; font-size: 0.75rem; font-style: italic; margin-top: 1px; } 
        
        /* Hộp số thứ tự */
        .series-box { color: #000; padding: 4px 10px; font-weight: 900; font-size: 1.4rem; border: 3px solid #000; line-height: 1; }
        
        /* Hình ảnh - Nhỏ lại 1 xíu */
        .prize-img { height: 1.8rem; width: auto; filter: grayscale(100%) contrast(1.2); object-fit: contain; }

        /* Cấu hình khi in */
        @media print { 
            .no-print { display: none !important; } 
            body { background-color: #fff; }
            .ticket-wrapper { box-shadow: none; margin-bottom: 0; border: none; }
            .page-break { margin-bottom: 0; }
        }
    </style>
</head>
<body class="pb-10">

    <div class="no-print bg-white p-5 mb-5 shadow-lg border-b-4 border-yellow-400 sticky top-0 z-50">
        <h1 class="text-2xl font-black text-center text-gray-800 mb-4 uppercase">Bảng Điều Khiển In Phiếu Bốc Thăm</h1>
        
        <div class="flex flex-col sm:flex-row justify-center items-center gap-4 max-w-3xl mx-auto">
            <div class="flex items-center gap-2">
                <label class="font-bold">Từ số:</label>
                <input type="number" id="startNumber" value="1" min="1" class="border-2 border-gray-400 rounded px-3 py-2 w-24 font-bold text-lg text-center">
            </div>
            
            <div class="flex items-center gap-2">
                <label class="font-bold">Đến số:</label>
                <input type="number" id="endNumber" value="100" min="1" class="border-2 border-gray-400 rounded px-3 py-2 w-24 font-bold text-lg text-center">
            </div>

            <button onclick="generateTickets()" class="bg-blue-600 hover:bg-blue-800 text-white font-black py-2 px-6 rounded shadow-lg border-2 border-blue-900 transition-colors">
                1. TẠO PHIẾU
            </button>

            <button onclick="window.print()" class="bg-green-600 hover:bg-green-800 text-white font-black py-2 px-6 rounded shadow-lg border-2 border-green-900 transition-colors">
                2. IN PHIẾU
            </button>
        </div>
        <p class="text-center text-red-600 font-bold text-sm mt-3" id="statusMessage">Vui lòng nhập khoảng số và bấm "Tạo phiếu" trước khi In.</p>
    </div>

    <div id="print-container" class="max-w-[210mm] mx-auto bg-white shadow-xl no-print-shadow">
        <!-- Mã HTML phiếu sẽ được Javascript chèn vào đây -->
    </div>

    <script>
        const IMG_PHONE = "dien thoai.png"; 
        const IMG_HEADPHONE = "tai nghe.png";

        function createTicketHTML(s) {
            const content = `
                <h1 class="title-text uppercase text-center border-b-2 border-black pb-1">Phiếu Bốc Thăm Trúng Thưởng   Thế Giới Di Động Tam Hòa</h1>
                <div class="text-center body-text mt-1 flex flex-col items-center gap-[2px]">
                                    <div class="flex items-center gap-2 uppercase">
                                        TRÚNG 2 SUẤT ĐT SAMSUNG A07
                                        <img src="dien thoai.png" class="prize-img" onerror="this.style.display='none'">
                                    </div>
                                    <div class="flex items-center gap-2 uppercase">
                                        60 Món Phụ Kiện
                                        <img src="tai nghe.png" class="prize-img" onerror="this.style.display='none'">
                                    </div>
                                    <p class="uppercase">Tất cả đều miễn phí</p>
                                    <p class="note-text mt-1">***Lưu ý: 1 phiếu bỏ thùng, 1 phiếu khách cầm***</p>
                                    <p class="note-text">Nếu Ngày 11/7 không trúng giữ lại 18/7 tiếp tục</p>
                                    <p class="note-text">🏠️🏠️Địa chỉ thế giới di động ngay cổng chào tam hiệp🏠️🏠️</p>
                                </div>
                <div class="flex justify-between items-end w-full mt-auto">
                    <div class="series-box">${s.replace('split', '')}</div>
                    <div class="date-text text-right">11/7 & 18/7 - 17H</div>
                </div>`;
            return `
                <div class="ticket-stub ${s.includes('split') ? '' : 'dashed-border-right'}">
                    <div class="watermark">TGDĐ TAM HÒA</div>
                    ${content}
                </div>`;
        }

        function generateTickets() {
            const start = parseInt(document.getElementById('startNumber').value);
            const end = parseInt(document.getElementById('endNumber').value);
            const container = document.getElementById('print-container');
            const statusMsg = document.getElementById('statusMessage');

            if (isNaN(start) || isNaN(end) || start > end) return;

            let htmlOutput = '';
            for (let i = start; i <= end; i++) {
                const s = i.toString().padStart(4, '0');
                if ((i - start) % 4 === 0) htmlOutput += '<div class="ticket-wrapper page-break">';
                
                htmlOutput += `<div class="ticket-row">${createTicketHTML(s) + createTicketHTML(s + 'split')}</div>`;
                
                if ((i - start) % 4 === 3 || i === end) htmlOutput += '</div>';
            }
            container.innerHTML = htmlOutput;
            statusMsg.textContent = "Đã tạo xong! Sẵn sàng in.";
        }

        window.onload = function() {
            document.getElementById('startNumber').value = 1;
            document.getElementById('endNumber').value = 20;
            generateTickets();
        };
    </script>
</body>
</html>
